<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가족 비서실">
<title>가족 합동 비서실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237fb84e'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>

<!-- 잠금 화면 -->
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-critter" id="lock-critter"></div>
    <h1>가족 합동 비서실</h1>
    <p class="sub">가족 PIN 4자리</p>

    <div class="pin-dots" id="pin-dots"><span></span><span></span><span></span><span></span></div>
    <p class="pin-msg" id="pin-msg"></p>

    <div class="keypad" id="keypad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" class="ghost" data-key="clear">지우기</button>
      <button type="button" data-key="0">0</button>
      <button type="button" class="ghost" data-key="back">⌫</button>
    </div>
  </div>
</div>

<!-- 본문 -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <span class="brand">가족 합동 비서실 <em id="conn-label"></em></span>
    <div class="topbar-right">
      <button type="button" class="me-chip" id="me-chip">
        <span class="me-dot" id="me-dot"></span>
        <span id="me-name">나 선택</span>
      </button>
      <button type="button" class="icon-btn" id="lock-btn" aria-label="잠그기">🔒</button>
    </div>
  </header>

  <main class="main">

    <section class="view" id="view-office">
      <h2 class="sec-title">우리 가족 <span class="muted" id="here-count"></span></h2>
      <div class="room-grid" id="room-grid"></div>

      <h2 class="sec-title">내 자리</h2>
      <div class="card">
        <div class="who-row" id="who-row"></div>
        <div class="seg" id="room-seg"></div>
        <div class="status-row">
          <input id="status-input" type="text" maxlength="30" placeholder="한 줄 상태 (예: 운행 중)" autocomplete="off">
          <button type="button" id="status-save">저장</button>
        </div>
      </div>
    </section>

    <section class="view" id="view-chat" hidden>
      <h2 class="sec-title">회의실</h2>
      <div class="card chat-card">
        <div class="chat-list" id="chat-list">
          <p class="empty" id="chat-empty">아직 메모가 없어요.</p>
        </div>
        <form class="input-row" id="chat-form">
          <input id="chat-input" type="text" maxlength="200" placeholder="메모 남기기" autocomplete="off">
          <button type="submit">보내기</button>
        </form>
      </div>
    </section>

    <section class="view" id="view-todo" hidden>
      <h2 class="sec-title">할 일 <span class="muted" id="todo-count"></span></h2>
      <div class="card">
        <form class="input-row" id="todo-form">
          <input id="todo-input" type="text" maxlength="80" placeholder="할 일 추가" autocomplete="off">
          <button type="submit">추가</button>
        </form>
        <ul class="todo-list" id="todo-list"></ul>
        <p class="empty" id="todo-empty">할 일이 없어요.</p>
      </div>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <button type="button" data-tab="office" class="active">오피스</button>
    <button type="button" data-tab="chat">회의실</button>
    <button type="button" data-tab="todo">할 일</button>
  </nav>
</div>

<!-- 누구세요 -->
<div class="sheet-backdrop" id="who-sheet" hidden>
  <div class="sheet">
    <h3>나는 누구인가요?</h3>
    <div class="who-list" id="who-list"></div>
    <button type="button" class="sheet-close" id="who-close">닫기</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
